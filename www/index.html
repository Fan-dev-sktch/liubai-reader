<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f0"><meta name="description" content="留白，一个安静、免费、以本地书籍为中心的阅读器。"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>留白</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"><script src="./vendor/jszip.min.js" defer></script><script src="./app.js" type="module"></script></head>
<body>
<div id="library" class="app-shell">
 <aside class="sidebar" aria-label="导航"><div class="brand"><span class="brand-mark">留</span><span>留白</span></div><nav><button class="nav active" data-view="shelf"><span data-icon="library"></span>书架</button><button class="nav" data-view="me" id="all-notes"><span data-icon="person"></span>我的</button></nav></aside>
 <main class="library-main">
  <header class="lib-head"><h1>书架</h1><div class="head-actions"><button class="icon-btn" id="search-toggle" aria-label="搜索书架"><span data-icon="search"></span></button><button class="icon-btn" id="import-top" aria-label="导入书籍"><span data-icon="plus"></span></button><button class="icon-btn" id="me-open" aria-label="我的"><span data-icon="person"></span></button></div></header>
  <div class="lib-search" id="lib-search" hidden><label class="search-box"><span data-icon="search"></span><input id="library-search" type="search" placeholder="书名、作者或文件名" aria-label="搜索书架" enterkeyhint="search"></label><button class="text-btn" id="search-cancel">取消</button></div>
  <section id="continue-card" class="continue-card" role="button" tabindex="0" hidden></section>
  <section class="shelf-section">
   <div class="shelf-bar"><div class="chips" role="tablist" aria-label="筛选"><button class="chip active" data-filter="all" role="tab">全部</button><button class="chip" data-filter="reading" role="tab">在读</button><button class="chip" data-filter="favorite" role="tab">收藏</button><button class="chip" data-filter="finished" role="tab">读完</button></div><button class="sort-btn" id="sort-open" aria-label="排序与视图"><span id="sort-label">最近阅读</span><span data-icon="sort" class="sort-chev"></span><span data-icon="sortby" class="sort-glyph"></span></button></div>
   <div id="batch-bar" hidden><span id="batch-count">已选 0</span><button class="text-btn" id="batch-all">全选</button><button class="text-btn" id="batch-favorite" data-i18n="批量收藏">收藏</button><button class="text-btn" id="batch-finish">读完</button><button class="text-btn danger" id="batch-delete">移出</button><button class="text-btn strong" id="batch-cancel">完成</button></div>
   <div id="book-grid" class="book-grid"></div>
   <p id="shelf-tip" class="shelf-tip" hidden>长按封面：收藏、编辑、多选或移出</p>
   <div id="empty" class="empty" hidden><div class="empty-art" aria-hidden="true"><span></span><span></span><span></span></div><h3>暂无书籍</h3><p>EPUB、MOBI、AZW3、FB2、TXT、PDF、漫画 CBZ</p><button class="primary" id="import-empty">导入书籍</button></div>
  </section>
 </main>
</div>
<section id="personal" hidden><header class="personal-header"><button id="personal-back" class="icon-btn" aria-label="返回书架"><span data-icon="back"></span></button><h1 id="personal-title">我的</h1></header><main id="personal-records"></main></section>
<section id="reader" hidden>
 <header class="reader-toolbar"><button id="back" class="icon-btn" aria-label="返回书架"><span data-icon="back"></span></button><div class="reader-meta"><strong id="reader-title"></strong><small id="chapter-title"></small></div><button class="icon-btn" id="search-open" aria-label="全文搜索"><span data-icon="search"></span></button><button class="icon-btn" id="bookmark" aria-label="书签"><span data-icon="bookmark"></span></button></header>
 <div id="pdf-zoom" hidden><button class="icon-btn" id="pdf-zoom-out" aria-label="缩小"><span data-icon="minus"></span></button><button class="text-btn" id="pdf-zoom-fit">适应宽度</button><button class="icon-btn" id="pdf-zoom-in" aria-label="放大"><span data-icon="plus"></span></button></div>
 <div id="reading-scroll"><article id="reading-content"></article><div id="page-neighbor" aria-hidden="true" inert hidden></div><div id="pdf-view" hidden><canvas id="pdf-canvas"></canvas><img id="comic-img" alt=""><div id="pdf-text"></div></div><div class="chapter-end"><button id="next-chapter" class="secondary">下一章</button></div></div>
 <footer class="reader-footer">
  <div id="scrub-tip" hidden></div><div class="progress-row"><button class="chap-btn" id="prev-chapter" aria-label="上一章"><span data-icon="left"></span></button><input id="progress" type="range" min="0" max="1000" value="0" aria-label="阅读进度"><button class="chap-btn" id="next-chapter-btn" aria-label="下一章"><span data-icon="right"></span></button></div>
  <div class="progress-info" id="progress-label"></div>
  <nav class="reader-tabs"><button id="toc-open"><span data-icon="list"></span><span>目录</span></button><button id="settings-open"><span data-icon="type"></span><span>外观</span></button><button id="night-toggle"><span data-icon="moon"></span><span id="night-label">夜间</span></button></nav>
 </footer>
 <div id="page-ribbon" hidden aria-label="此页已加书签"></div><button id="back-pill" hidden><span>回到原处</span></button><div id="status-line"><span id="status-chapter"></span><span id="status-right"></span></div>
 <div id="auto-pill" hidden><span data-icon="timer"></span><span id="auto-label">自动翻页</span><button class="icon-btn" id="auto-slower" aria-label="减慢"><span data-icon="minus"></span></button><button class="icon-btn" id="auto-faster" aria-label="加快"><span data-icon="plus"></span></button><button class="icon-btn" id="auto-stop" aria-label="停止自动翻页"><span data-icon="close"></span></button></div>
</section>
<div id="panel-shade" hidden></div><aside id="panel" hidden aria-label="阅读面板"><div class="panel-grip" aria-hidden="true"></div><div class="panel-head"><button id="panel-back" class="icon-btn" hidden aria-label="返回"><span data-icon="back"></span></button><h2 id="panel-title"></h2><button id="panel-close" class="icon-btn" aria-label="关闭面板"><span data-icon="close"></span></button></div><div id="panel-body"></div></aside>
<div id="selection-menu" hidden><div class="selection-colors"><button data-highlight-color="yellow" class="note-color" aria-label="黄色划线"></button><button data-highlight-color="green" class="note-color" aria-label="绿色划线"></button><button data-highlight-color="blue" class="note-color" aria-label="蓝色划线"></button><button data-highlight-color="pink" class="note-color" aria-label="粉色划线"></button></div><span class="sel-divider"></span><div class="selection-actions"><button id="note-selection" data-i18n="笔记（动作）">笔记</button><button id="copy-selection">复制</button><button id="lookup-selection">查词</button><button id="share-selection">分享</button></div></div>
<dialog id="dialog" tabindex="-1"><form method="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-btn" value="cancel" aria-label="关闭"><span data-icon="close"></span></button></div><div id="dialog-body"></div><div id="dialog-actions"></div></form></dialog>
<input type="file" id="file-input" accept=".epub,.mobi,.azw3,.azw,.prc,.fb2,.cbz,.zip,.txt,.pdf,.md,.markdown,.html,.htm,.xhtml" multiple hidden><input type="file" id="backup-input" accept=".zip" hidden><input type="file" id="font-input" accept=".ttf,.otf,.woff,.woff2" hidden><input type="file" id="cover-input" accept="image/*" hidden><div id="toast" role="status" hidden></div><div id="busy" hidden><div class="spinner"></div><p id="busy-text">正在整理书籍…</p></div><div id="drop-overlay" hidden><span data-icon="plus"></span><h2>松手即可导入</h2><p>EPUB、MOBI、AZW3、FB2、TXT、PDF、CBZ</p></div>
</body></html>
